[project]
name = "knewkarma"
version = "8.0.0"
description = "Reddit-data analysis toolkit"
authors = [{ name = "Ritchie Mwewa", email = "rly0nheart@duck.com" }]
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.11"
keywords = ["reddit", "data-analysis"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Operating System :: OS Independent",
    "Natural Language :: English",
]
dependencies = [
    "requests>=2.32.3",
    "rich>=13.7.1",
]

[project.urls]
issues = "https://codeberg.org/rly0nheart/knewkarma/issues"
repository = "https://codeberg.org/rly0nheart/knewkarma"

[project.scripts]
knewkarma = "knewkarma.cli:main"

[dependency-groups]
dev = [
    "myst-parser>=3.0.1",
    "pytest>=9.1.1",
    "sphinx>=7.4.7",
    "sphinx-rtd-theme>=2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/knewkarma"]
