[project]
name = "knewkarma"
version = "9.1.2"
description = "Reddit-data analysis toolkit"
authors = [{ name = "Ritchie Mwewa", email = "rly0nheart@duck.com" }]
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.12"
keywords = ["reddit", "data-analysis"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Operating System :: OS Independent",
    "Natural Language :: English",
]
dependencies = [
    "requests>=2.34.2",
    "rich>=15.0.0",
]

[project.urls]
issues = "https://codeberg.org/knewkarma/knewkarma/issues"
repository = "https://codeberg.org/knewkarma/knewkarma"
documentation = "https://knewkarma.readthedocs.io"

[project.scripts]
knewkarma = "knewkarma.cli.main:run_cli"

[dependency-groups]
dev = [
    "myst-parser>=5.1.0",
    "pytest>=9.1.1",
    "sphinx>=9.1.0",
    "sphinx-rtd-theme>=3.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/knewkarma"]
