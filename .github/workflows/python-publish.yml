# Builds the package, cuts a GitHub Release, and publishes to PyPI on every push to master.

name: Upload Python Package

on:
  push:
    branches: [ master ]

permissions:
  contents: write   # needed to create the GitHub Release
  id-token: write   # needed for PyPI trusted publishing

jobs:
  release-build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      release_notes: ${{ steps.get_notes.outputs.notes }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Get version from pyproject.toml
        id: get_version
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Extract release notes from CHANGELOG
        id: get_notes
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          NOTES=$(awk -v ver="$VERSION" '
            /^## \[/ {
              if (found) exit
              if ($0 ~ "\\[" ver "\\]") found=1
              next
            }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md)
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Build release distributions
        run: |
          python -m pip install uv
          python -m uv build

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: release-dists
          path: dist/

  github-release:
    runs-on: ubuntu-latest
    needs: release-build

    steps:
      - uses: actions/checkout@v4

      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release-build.outputs.version }}
          name: ${{ needs.release-build.outputs.version }}
          body: ${{ needs.release-build.outputs.release_notes }}
          files: dist/*
          generate_release_notes: false

  pypi-publish:
    runs-on: ubuntu-latest
    needs:
      - release-build
      - github-release

    environment:
      name: pypi
      url: https://pypi.org/p/knewkarma

    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist/

      - name: Publish release distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true
